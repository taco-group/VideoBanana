[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videobanana"
version = "1.0.0"
description = "ChatVE-Bench evaluation and the VideoBanana multi-turn video editing agent"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "opencv-python-headless",
    "imageio-ffmpeg",
    "google-genai",
    "huggingface_hub",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
openai = ["openai"]
# Gemini batch mode stages requests and videos in Cloud Storage.
batch = ["google-cloud-storage"]
test = ["pytest"]

[tool.setuptools]
packages = ["chatve_bench", "videobanana", "videobanana.conversation", "videobanana.models"]

[tool.setuptools.package-data]
chatve_bench = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
